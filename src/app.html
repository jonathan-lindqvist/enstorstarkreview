<!doctype html>
<html lang="sv" data-theme="%app.theme%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta property="csp-nonce" content="%sveltekit.nonce%" />
		<script nonce="%sveltekit.nonce%">
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				window.dataLayer.push(arguments);
			}
			window.gtag = gtag;

			const analyticsConsent = '%app.analyticsConsent%';

			gtag('consent', 'default', {
				analytics_storage: analyticsConsent === 'granted' ? 'granted' : 'denied',
				ad_storage: 'denied',
				ad_user_data: 'denied',
				ad_personalization: 'denied',
				wait_for_update: 500
			});
		</script>
		<script
			async
			nonce="%sveltekit.nonce%"
			src="https://www.googletagmanager.com/gtag/js?id=G-M94PLHJ4XW"
		></script>
		<script nonce="%sveltekit.nonce%">
			gtag('js', new Date());
			gtag('config', 'G-M94PLHJ4XW', { anonymize_ip: true });
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
