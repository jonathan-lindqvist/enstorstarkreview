# Disposable CI stack for `make check` and `make ci`; GitHub Actions runs `make ci`. Nothing
# persists between runs.

# The Makefile gives each checkout its own project name with -p; this is the safe default.
name: enstorstarkreview-ci

services:
  ci:
    build:
      context: .
      dockerfile: Dockerfile.ci
    # Forwards Ctrl-C to the check runner.
    init: true
    # Chromium fails screenshots with Docker's default 64 MB under concurrent checks.
    shm_size: 1gb
    environment:
      CI: 'true'
      GITHUB_ACTIONS: ${GITHUB_ACTIONS:-}
      CI_CHECKS: ${CI_CHECKS:-}
      CI_JOBS: ${CI_JOBS:-}
      CI_FULL: ${CI_FULL:-}
      # run.js starts the extra shard databases with Compose on the host daemon.
      CI_PROJECT: ${CI_PROJECT:?run make ci}
      GIT_COMMON_DIR: ${GIT_COMMON_DIR}
      MONGO_URI: mongodb://mongo-1:27017/enstorstark
    depends_on:
      mongo-1:
        condition: service_healthy
    volumes:
      - .:/src:ro
      # The repository's .git directory at its host path, which a worktree's .git file points to.
      - ${GIT_COMMON_DIR:?run make check or make ci}:${GIT_COMMON_DIR}:ro
      - ./ci-output:/out
      # The backup/restore rehearsal creates and removes its own containers on the host daemon.
      # Its bind mounts resolve on the host, so its temporary files need the same path on both sides.
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/enstorstarkreview-ci:/tmp/enstorstarkreview-ci

  # Development demo users; the unpublished, anonymous volume is removed with the stack.
  mongo-1: &mongo
    build:
      context: ./db
      target: development
    # Otherwise each database may claim half of the Docker VM's memory; the test data is small.
    command: ['--wiredTigerCacheSizeGB', '0.25']
    healthcheck:
      # Listening on all interfaces at 27017 (hex 6989) is the final server, not the localhost-only
      # init server; mongosh would add ~160 MB per probe.
      test: ['CMD-SHELL', "grep -q ':6989 00000000:0000 0A' /proc/net/tcp"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
  # Extra databases for Playwright shards running side by side; run.js starts them when needed.
  mongo-2: *mongo
  mongo-3: *mongo
