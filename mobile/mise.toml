# Tools for building the mobile app (iOS needs only Xcode; Android needs the rest).
# Set up with `mise install` and `mise bootstrap packages apply`. The Android SDK itself is not
# managed here; install it with `skip android sdk install` or Android Studio, at the location below.

[env]
ANDROID_HOME = "{{env.HOME}}/Library/Android/sdk"
_.path = ["{{env.HOME}}/Library/Android/sdk/platform-tools"]

[tools]
# Keep in step with the skip package version in Package.resolved. Xcode builds use the CLI
# that the package plugin downloads; `skip export` and the Gradle prebuild use this one.
"github:skiptools/skip" = "1.9.13"
# There is no Gradle wrapper in Android/, so this is the Gradle every build uses.
gradle = "9.8.2"
# JDK for Gradle. mise sets JAVA_HOME, so Gradle does not pick up another installed JDK.
java = "temurin-25"

[bootstrap.packages]
# Skip runs `swiftly run` to build the Swift code for Android. Homebrew packages are
# machine-wide and unversioned.
"brew:swiftly" = "latest"
