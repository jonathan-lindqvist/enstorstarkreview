# Generated from src/lib/server/api/contract by `npm run api:generate`. Do not edit by hand.
# The HttpApi definition is the source of truth; a unit test fails when this file is stale.
openapi: 3.1.0
info:
  title: En stor stark API
  version: 1.0.0
  description: |
    Readers use the public endpoints without authentication. Reviewers sign in with
    `POST /sessions` and send the returned token as `Authorization: Bearer <token>`.

    The API never reads the web session cookie. Authentication requires an explicit bearer
    token rather than ambient browser cookies. Request bodies are JSON; image downloads
    return image bytes, and some operations have no request or response body.

    User-facing messages (`detail`, `errors[].detail`) are Swedish and are safe to show to
    the user. Clients branch on `code` and HTTP status, never on message text.

    Public collection and detail responses include an `ETag`; send `If-None-Match` to get
    `304 Not Modified`. Review updates require `If-Match` with the review's current `ETag`.
  summary: JSON API for the native En stor stark clients.
servers:
  - url: /api/v1
tags:
  - name: Sessions
  - name: Metadata
  - name: Reviews
  - name: Images
  - name: Map
  - name: Statistics
  - name: Review requests
security:
  - {}
  - bearerAuth: []
paths:
  /sessions:
    post:
      tags:
        - Sessions
      operationId: createSession
      security:
        - {}
      responses:
        "201":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "400":
          description: The body is not valid JSON.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Wrong username or password.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers:
            WWW-Authenticate:
              schema:
                type: string
        "413":
          description: The request body or image is too large.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: The request body is not `application/json`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: One or more fields are invalid. Structural schema validation stops at the first failure; clients should correct that field and retry. See `errors`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many requests.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
      description: "Uses the same credential checks, rate limits (per IP and per username) and audit events as the web login. The token is a session identifier with a 30-day sliding expiry: every authenticated request in the second half of its lifetime extends it. The IP limit is consumed before body parsing, including malformed requests. The JSON body must be at most 16 KiB; structurally valid bodies also consume the username limit."
      summary: Sign in with a username and password.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreateRequest"
        required: true
  /sessions/current:
    get:
      tags:
        - Sessions
      operationId: getCurrentSession
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Authentication is missing, invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers:
            WWW-Authenticate:
              schema:
                type: string
      summary: Get the signed-in user and the token expiry.
    delete:
      tags:
        - Sessions
      operationId: deleteCurrentSession
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Signed out.
        "401":
          description: Authentication is missing, invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers:
            WWW-Authenticate:
              schema:
                type: string
      summary: Sign out and invalidate the token.
  /review-metadata:
    get:
      tags:
        - Metadata
      operationId: getReviewMetadata
      security:
        - {}
      responses:
        "200":
          description: Review metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewMetadata"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          description: The cached representation is still current.
      description: Clients render rating labels and build the review form from this data.
      summary: Rating aspects, overall-rating rules, beer brands and input limits.
  /users:
    get:
      tags:
        - Metadata
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Reviewers, sorted with Swedish collation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          description: Authentication is missing, invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers:
            WWW-Authenticate:
              schema:
                type: string
      summary: List reviewer usernames for the author picker.
  /reviews:
    get:
      tags:
        - Reviews
      operationId: listReviews
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 80
          required: false
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/ReviewSort"
          required: false
      responses:
        "200":
          description: Matching reviews in the requested order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewList"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          description: The cached representation is still current.
      description: Anonymous clients get only published reviews. Authenticated clients also get drafts. The search matches the title, location, description, beer brand and authors.
      summary: List reviews.
    post:
      tags:
        - Reviews
      operationId: createReview
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
          headers:
            Location:
              description: API path of the new review.
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
        "400":
          description: The body is not valid JSON.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication is missing, invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers:
            WWW-Authenticate:
              schema:
                type: string
        "409":
          description: The request conflicts with the current state. `code` is `duplicate_slug`, `already_published` or `concurrent_update`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The request body or image is too large.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: The request body is not `application/json`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: One or more fields are invalid. Structural schema validation stops at the first failure; clients should correct that field and retry. See `errors`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: The server could not complete the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      description: New reviews are always drafts. Publish them with the publication endpoint. The JSON body must be at most 22 MiB; decoded images must be at most 15 MiB.
      summary: Create a draft review.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCreateRequest"
        required: true
  /reviews/{slug}:
    get:
      tags:
        - Reviews
      operationId: getReview
      parameters:
        - name: slug
          in: path
          schema:
            type: string
          required: true
      responses:
        "200":
          description: The review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          description: The cached representation is still current.
        "404":
          description: The resource does not exist or is not visible to this client.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      description: Drafts return 404 to anonymous clients.
      summary: Get one review.
    put:
      tags:
        - Reviews
      operationId: updateReview
      parameters:
        - name: slug
          in: path
          schema:
            type: string
          required: true
        - name: if-match
          in: header
          schema:
            type: string
            description: The strong `ETag` from the last read of this review. A list is accepted when it contains the current strong tag. Wildcards are rejected, even in a list; weak tags never match. A missing header returns 428, a nonmatching header returns 412.
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Review updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "400":
          description: The body is not valid JSON.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication is missing, invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers:
            WWW-Authenticate:
              schema:
                type: string
        "404":
          description: The resource does not exist or is not visible to this client.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The request conflicts with the current state. `code` is `duplicate_slug`, `already_published` or `concurrent_update`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          description: The `If-Match` value is not the current `ETag`. Reload and try again.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The request body or image is too large.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: The request body is not `application/json`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: One or more fields are invalid. Structural schema validation stops at the first failure; clients should correct that field and retry. See `errors`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "428":
          description: The `If-Match` header is missing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: The server could not complete the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      description: Any reviewer may edit any review. Send every editable field; omit `image` to keep the current photo and `attributes` to keep the current attributes. The publication status is never changed. The slug may change, so use the returned review's `slug` afterwards. The JSON body must be at most 22 MiB. If-Match requires a current strong entity tag; wildcard and weak-only preconditions return 412 and never permit an unconditional overwrite.
      summary: Replace the editable fields of a review.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewUpdateRequest"
        required: true
    delete:
      tags:
        - Reviews
      operationId: deleteReview
      parameters:
        - name: slug
          in: path
          schema:
            type: string
          required: true
        - name: if-match
          in: header
          schema:
            type: string
            description: The strong `ETag` from the last read of this review. A list is accepted when it contains the current strong tag. Wildcards are rejected, even in a list; weak tags never match. A missing header returns 428, a nonmatching header returns 412.
          required: true
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Review deleted.
        "401":
          description: Authentication is missing, invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers:
            WWW-Authenticate:
              schema:
                type: string
        "404":
          description: The resource does not exist or is not visible to this client.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The request conflicts with the current state. `code` is `duplicate_slug`, `already_published` or `concurrent_update`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          description: The `If-Match` value is not the current `ETag`. Reload and try again.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "428":
          description: The `If-Match` header is missing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: The server could not complete the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      description: Any reviewer may delete any review, draft or published, like on the web. The review is hidden from every reader afterwards; its history and photo stay on the server, and copies that browsers or shared caches already hold can remain. A deleted review returns 404 everywhere, including a second delete. If-Match requires a current strong entity tag, so a review that changed since the client read it is never deleted.
      summary: Delete a review.
  /reviews/{slug}/publication:
    post:
      tags:
        - Reviews
      operationId: publishReview
      parameters:
        - name: slug
          in: path
          schema:
            type: string
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The published review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          description: Authentication is missing, invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers:
            WWW-Authenticate:
              schema:
                type: string
        "404":
          description: The resource does not exist or is not visible to this client.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The request conflicts with the current state. `code` is `duplicate_slug`, `already_published` or `concurrent_update`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: The server could not complete the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      description: Publication is one-way and keeps the credited authors.
      summary: Publish a draft review.
  /reviews/{slug}/history:
    get:
      tags:
        - Reviews
      operationId: getReviewHistory
      parameters:
        - name: slug
          in: path
          schema:
            type: string
          required: true
      responses:
        "200":
          description: The change history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewHistory"
        "404":
          description: The resource does not exist or is not visible to this client.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      summary: Get the change history of a review, newest first.
  /nearby-reviews:
    get:
      tags:
        - Reviews
      operationId: getNearbyReviews
      parameters:
        - name: address
          in: query
          schema:
            type: string
          required: true
        - name: exclude
          in: query
          schema:
            type: string
          required: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearbyReviews"
        "400":
          description: The body is not valid JSON.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication is missing, invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers:
            WWW-Authenticate:
              schema:
                type: string
        "404":
          description: The resource does not exist or is not visible to this client.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: A required service is not available. Try again later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      description: "The same comparison as the web review form, beside the barhop rating. The center is the saved position of another review with the same address (compared case-insensitively after whitespace cleanup); the server never geocodes a new address and never accepts a device location. Counts include drafts, so the endpoint requires a token. When editing, pass the review's slug as `exclude`: that review is left out of the counts, but its own saved address can still be the center. Distances are approximate, as the crow flies."
      summary: Count reviewed bars near an address, for the barhop rating.
  /images/{filename}:
    get:
      tags:
        - Images
      operationId: getImage
      parameters:
        - name: filename
          in: path
          schema:
            type: string
          required: true
        - name: preview
          in: query
          schema:
            type: string
            enum:
              - card-v1
              - detail-v1
            description: Give at most once. Any other value is `400` with code `bad_request`.
          required: false
      responses:
        "200":
          description: The image bytes. A preview is always `image/webp`.
          content:
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            image/webp:
              schema:
                type: string
                contentMediaType: image/webp
        "400":
          description: The `preview` value is unknown or given more than once.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The resource does not exist or is not visible to this client.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Too many previews are being generated. Retry after the given time.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
      description: |-
        Use the `image.url` of a review instead of building this path. Images of drafts need authentication. Published images are immutable and can be cached forever.

        Without `preview`, the response is the original upload, which can be several megabytes and tens of megapixels. Lists and detail screens should request a preview: a WebP scaled to at most 768 (`card-v1`) or 1280 (`detail-v1`) pixels wide, never enlarged. A preview has the same access rules and cache headers as the original.
      summary: Download a review photo.
  /map:
    get:
      tags:
        - Map
      operationId: getMap
      security:
        - {}
      responses:
        "200":
          description: Map markers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewMap"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          description: The cached representation is still current.
      description: Coordinates come from the server's geocode cache. A review without a resolved address has no marker. Clients must never send the device location to this API.
      summary: Get map markers for published reviews with known coordinates.
  /map/geocoding:
    post:
      tags:
        - Map
      operationId: resolveNextMapMarker
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A new marker was resolved. Returns the updated map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewMap"
        "204":
          description: No marker was resolved.
        "401":
          description: Authentication is missing, invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers:
            WWW-Authenticate:
              schema:
                type: string
      description: Reviewers call this after the map is shown. The server makes at most one address attempt per call and returns 204 when there is nothing to do or another attempt is active.
      summary: Geocode at most one published review address that has no marker.
  /statistics:
    get:
      tags:
        - Statistics
      operationId: getStatistics
      security:
        - {}
      responses:
        "200":
          description: Statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewStatistics"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "304":
          description: The cached representation is still current.
      summary: Get statistics for published reviews.
  /review-requests:
    post:
      tags:
        - Review requests
      operationId: createReviewRequest
      security:
        - {}
      responses:
        "202":
          description: The request was accepted for the reviewers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRequestAccepted"
        "400":
          description: The body is not valid JSON.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The request body or image is too large.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: The request body is not `application/json`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: One or more fields are invalid. Structural schema validation stops at the first failure; clients should correct that field and retry. See `errors`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many requests.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "502":
          description: A required service is not available. Try again later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: A required service is not available. Try again later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      description: Uses the same validation, rate limits and Discord delivery as the web form. The IP quota is consumed before parsing, including malformed requests. The JSON body must be at most 16 KiB. Only valid submissions consume the global delivery quota.
      summary: Ask the reviewers to review a bar.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequestCreateRequest"
        required: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The `token` from `POST /sessions`.
  headers:
    ETag:
      description: Entity tag of the response. Send it back in `If-None-Match` or `If-Match`.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before a retry.
      schema:
        type: integer
        minimum: 0
  schemas:
    FieldError:
      type: object
      properties:
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) into the request body. Empty for the whole body.
          examples:
            - /title
            - /beer/priceKr
            - /ratings/atmosphere
        detail:
          type: string
          description: Swedish message that clients can show next to the field.
      required:
        - pointer
        - detail
      additionalProperties: false
    ProblemCode:
      type: string
      enum:
        - bad_request
        - unauthorized
        - invalid_credentials
        - not_found
        - validation_failed
        - duplicate_slug
        - already_published
        - concurrent_update
        - precondition_failed
        - precondition_required
        - payload_too_large
        - unsupported_media_type
        - rate_limited
        - service_unavailable
        - internal_error
    Problem:
      type: object
      properties:
        status:
          type: integer
        code:
          $ref: "#/components/schemas/ProblemCode"
        title:
          type: string
          description: Short English summary for logs.
        detail:
          type: string
          description: Swedish message that clients can show.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
      required:
        - status
        - code
        - title
        - detail
      additionalProperties: false
      description: RFC 9457 problem details with a machine-readable `code`.
    ReviewRequestAccepted:
      type: object
