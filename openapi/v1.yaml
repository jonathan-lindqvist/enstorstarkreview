# Generated from the oRPC router (src/lib/server/rpc) by `npm run api:generate`.
# Do not edit by hand: change the procedures and schemas, then regenerate.
openapi: 3.1.0
info:
  title: En stor stark API
  version: 1.0.0
  summary: JSON API for the native En stor stark clients.
  description: >
    Readers use the public endpoints without authentication. Reviewers sign in
    with

    `POST /sessions` and send the returned token as `Authorization: Bearer
    <token>`.


    The API never reads the web session cookie. Authentication requires an
    explicit bearer

    token rather than ambient browser cookies. Request bodies are JSON; image
    downloads

    return image bytes, and some operations have no request or response body.


    User-facing messages (`detail`, `errors[].detail`) are Swedish and are safe
    to show to

    the user. Clients branch on `code` and HTTP status, never on message text.


    Public collection and detail responses include an `ETag`; send
    `If-None-Match` to get

    `304 Not Modified`. Review updates require `If-Match` with the review's
    current `ETag`.
servers:
  - url: /api/v1
tags:
  - name: Sessions
  - name: Metadata
  - name: Reviews
  - name: Images
  - name: Map
  - name: Statistics
  - name: Review requests
security:
  - {}
  - bearerAuth: []
paths:
  /sessions:
    post:
      tags:
        - Sessions
      operationId: createSession
      summary: Sign in with a username and password.
      description: >
        Uses the same credential checks, rate limits (per IP and per username)
        and audit

        events as the web login. The token is a session identifier with a 30-day
        sliding

        expiry: every authenticated request in the second half of its lifetime
        extends it.

        The IP limit is consumed before body parsing, including malformed
        requests. The

        JSON body must be at most 16 KiB; structurally valid bodies also consume
        the username limit.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
      responses:
        '201':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong username or password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /sessions/current:
    get:
      tags:
        - Sessions
      operationId: getCurrentSession
      summary: Get the signed-in user and the token expiry.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - Sessions
      operationId: deleteCurrentSession
      summary: Sign out and invalidate the token.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /review-metadata:
    get:
      tags:
        - Metadata
      operationId: getReviewMetadata
      summary: Rating aspects, overall-rating rules, beer brands and input limits.
      description: Clients render rating labels and build the review form from this data.
      security:
        - {}
      responses:
        '200':
          description: Review metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewMetadata'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '304':
          $ref: '#/components/responses/NotModified'
  /users:
    get:
      tags:
        - Metadata
      operationId: listUsers
      summary: List reviewer usernames for the author picker.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reviewers, sorted with Swedish collation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reviews:
    get:
      tags:
        - Reviews
      operationId: listReviews
      summary: List reviews.
      description: >
        Anonymous clients get only published reviews. Authenticated clients also
        get drafts.

        The search matches the title, location, description, beer brand and
        authors.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: sort
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReviewSort'
      responses:
        '200':
          description: Matching reviews in the requested order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewList'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '304':
          $ref: '#/components/responses/NotModified'
    post:
      tags:
        - Reviews
      operationId: createReview
      summary: Create a draft review.
      description: >
        New reviews are always drafts. Publish them with the publication
        endpoint.

        The JSON body must be at most 22 MiB; decoded images must be at most 15
        MiB.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          headers:
            Location:
              description: API path of the new review.
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /reviews/{slug}:
    get:
      tags:
        - Reviews
      operationId: getReview
      summary: Get one review.
      description: Drafts return 404 to anonymous clients.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: The review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Reviews
      operationId: updateReview
      summary: Replace the editable fields of a review.
      description: >
        Any reviewer may edit any review. Send every editable field; omit
        `image` to keep the

        current photo and `attributes` to keep the current attributes. The
        publication status is never changed. The slug may change, so use

        the returned review's `slug` afterwards.

        The JSON body must be at most 22 MiB. If-Match requires a current strong
        entity tag;

        wildcard and weak-only preconditions return 412 and never permit an
        unconditional overwrite.
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: If-Match
          in: header
          required: true
          description: >
            The strong `ETag` from the last read of this review. A list is
            accepted when it

            contains the current strong tag. Wildcards are rejected, even in a
            list; weak

            tags never match. A missing header returns 428, a nonmatching header
            returns 412.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewUpdateRequest'
      responses:
        '200':
          description: Review updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Reviews
      operationId: deleteReview
      summary: Delete a review.
      description: >
        Any reviewer may delete any review, draft or published, like on the web.
        The review is

        hidden from every reader afterwards; its history and photo stay on the
        server, and

        copies that browsers or shared caches already hold can remain. A deleted
        review returns

        404 everywhere, including a second delete. If-Match requires a current
        strong entity tag,

        so a review that changed since the client read it is never deleted.
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: If-Match
          in: header
          required: true
          description: >
            The strong `ETag` from the last read of this review. Wildcards and
            weak tags are

            rejected. A missing header returns 428, a nonmatching header returns
            412.
          schema:
            type: string
      responses:
        '204':
          description: Review deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /reviews/{slug}/publication:
    post:
      tags:
        - Reviews
      operationId: publishReview
      summary: Publish a draft review.
      description: Publication is one-way and keeps the credited authors.
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: The published review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /reviews/{slug}/history:
    get:
      tags:
        - Reviews
      operationId: getReviewHistory
      summary: Get the change history of a review, newest first.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: The change history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewHistory'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
  /images/{filename}:
    get:
      tags:
        - Images
      operationId: getImage
      summary: Download a review photo.
      description: >
        Use the `image.url` of a review instead of building this path. Images of
        drafts need

        authentication. Published images are immutable and can be cached
        forever.


        Without `preview`, the response is the original upload, which can be
        several megabytes

        and tens of megapixels. Lists and detail screens should request a
        preview: a WebP scaled

        to at most 768 (`card-v1`) or 1280 (`detail-v1`) pixels wide, never
        enlarged. A preview

        has the same access rules and cache headers as the original.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9a-f]{24}\.(jpe?g|png|webp)$
        - name: preview
          in: query
          required: false
          description: Give at most once. Any other value is `400` with code `bad_request`.
          schema:
            enum:
              - card-v1
              - detail-v1
            type: string
      responses:
        '200':
          description: The image bytes. A preview is always `image/webp`.
          content:
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            image/webp:
              schema:
                type: string
                contentMediaType: image/webp
        '400':
          description: The `preview` value is unknown or given more than once.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Too many previews are being generated. Retry after the given time.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /nearby-reviews:
    get:
      tags:
        - Reviews
      operationId: getNearbyReviews
      summary: Count reviewed bars near an address, for the barhop rating.
      description: >
        The same comparison as the web review form, beside the barhop rating.
        The center is the

        saved position of another review with the same address (compared
        case-insensitively

        after whitespace cleanup); the server never geocodes a new address and
        never accepts a

        device location. Counts include drafts, so the endpoint requires a
        token. When editing,

        pass the review's slug as `exclude`: that review is left out of the
        counts, but its own

        saved address can still be the center. Distances are approximate, as the
        crow flies.
      security:
        - bearerAuth: []
      parameters:
        - name: address
          in: query
          required: true
          description: The address entered in the form. Give it exactly once.
          schema:
            type: string
            minLength: 1
            maxLength: 300
        - name: exclude
          in: query
          required: false
          description: Slug of the review being edited. Give it at most once.
          schema:
            type: string
      responses:
        '200':
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyReviews'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /map:
    get:
      tags:
        - Map
      operationId: getMap
      summary: Get map markers for published reviews with known coordinates.
      description: >
        Coordinates come from the server's geocode cache. A review without a
        resolved address

        has no marker. Clients must never send the device location to this API.
      security:
        - {}
      responses:
        '200':
          description: Map markers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewMap'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '304':
          $ref: '#/components/responses/NotModified'
  /map/geocoding:
    post:
      tags:
        - Map
      operationId: resolveNextMapMarker
      summary: Geocode at most one published review address that has no marker.
      description: >
        Reviewers call this after the map is shown. The server makes at most one
        address

        attempt per call and returns 204 when there is nothing to do or another
        attempt is

        active.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A new marker was resolved. Returns the updated map.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewMap'
        '204':
          description: No marker was resolved.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /statistics:
    get:
      tags:
        - Statistics
      operationId: getStatistics
      summary: Get statistics for published reviews.
      security:
        - {}
      responses:
        '200':
          description: Statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewStatistics'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '304':
          $ref: '#/components/responses/NotModified'
  /review-requests:
    post:
      tags:
        - Review requests
      operationId: createReviewRequest
      summary: Ask the reviewers to review a bar.
      description: >
        Uses the same validation, rate limits and Discord delivery as the web
        form.

        The IP quota is consumed before parsing, including malformed requests.
        The JSON

        body must be at most 16 KiB. Only valid submissions consume the global
        delivery quota.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequestCreateRequest'
      responses:
        '202':
          description: The request was accepted for the reviewers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewRequestAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The `token` from `POST /sessions`.
  headers:
    ETag:
      description: Entity tag of the response. Send it back in `If-None-Match` or
        `If-Match`.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before a retry.
      schema:
        type: integer
        minimum: 0
  responses:
    NotModified:
      description: The cached representation is still current.
    BadRequest:
      description: The body is not valid JSON.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is missing, invalid or expired.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is not visible to this client.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: >
        The request conflicts with the current state. `code` is
        `duplicate_slug`,

        `already_published` or `concurrent_update`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: The `If-Match` value is not the current `ETag`. Reload and try again.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: The `If-Match` header is missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The request body or image is too large.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The request body is not `application/json`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: >
        One or more fields are invalid. Structural schema validation stops at
        the first

        failure; clients should correct that field and retry. See `errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A required service is not available. Try again later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: The server could not complete the request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        status:
          type: integer
        code:
          $ref: '#/components/schemas/ProblemCode'
        title:
          type: string
          description: Short English summary for logs.
        detail:
          type: string
          description: Swedish message that clients can show.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      required:
        - status
        - code
        - title
        - detail
      description: RFC 9457 problem details with a machine-readable `code`.
    ProblemCode:
      enum:
        - bad_request
        - unauthorized
        - invalid_credentials
        - not_found
        - validation_failed
        - duplicate_slug
        - already_published
        - concurrent_update
        - precondition_failed
        - precondition_required
        - payload_too_large
        - unsupported_media_type
        - rate_limited
        - service_unavailable
        - internal_error
      type: string
    FieldError:
      type: object
      properties:
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) into the request body. Empty for the whole
            body.
          examples:
            - /title
            - /beer/priceKr
            - /ratings/atmosphere
        detail:
          type: string
          description: Swedish message that clients can show next to the field.
      required:
        - pointer
        - detail
    SessionCreateRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 256
        password:
          type: string
          maxLength: 1024
      required:
        - username
        - password
      additionalProperties: false
      x-max-body-bytes: 16384
    User:
      type: object
      properties:
        username:
          type: string
      required:
        - username
    Session:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        expiresAt:
          type: string
          format: date-time
      required:
        - user
        - expiresAt
    SessionCreated:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          properties:
            token:
              type: string
              description: Store it in the Keychain or Android encrypted storage.
          required:
            - token
    UserList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
      required:
        - users
    RatingKey:
      enum:
        - atmosphere
        - service
        - selection
        - quality
        - price
        - cleanliness
        - soundLevel
        - barhopPotential
      type: string
    Ratings:
      type: object
      properties:
        atmosphere:
          type: number
          minimum: 0
          maximum: 5
        service:
          type: number
          minimum: 0
          maximum: 5
        selection:
          type: number
          minimum: 0
          maximum: 5
        quality:
          type: number
          minimum: 0
          maximum: 5
        price:
          type: number
          minimum: 0
          maximum: 5
        cleanliness:
          type: number
          minimum: 0
          maximum: 5
        soundLevel:
          type: number
          minimum: 0
          maximum: 5
        barhopPotential:
          type: number
          minimum: 0
          maximum: 5
      required:
        - atmosphere
        - service
        - selection
        - quality
        - price
        - cleanliness
        - soundLevel
        - barhopPotential
      additionalProperties: false
      description: Aspect ratings from 0 to 5.
    RatingsInput:
      type: object
      properties:
        atmosphere:
          type: integer
          minimum: 0
          maximum: 5
        service:
          type: integer
          minimum: 0
          maximum: 5
        selection:
          type: integer
          minimum: 0
          maximum: 5
        quality:
          type: integer
          minimum: 0
          maximum: 5
        price:
          type: integer
          minimum: 0
          maximum: 5
        cleanliness:
          type: integer
          minimum: 0
          maximum: 5
        soundLevel:
          type: integer
          minimum: 0
          maximum: 5
        barhopPotential:
          type: integer
          minimum: 0
          maximum: 5
      required:
        - atmosphere
        - service
        - selection
        - quality
        - price
        - cleanliness
        - soundLevel
        - barhopPotential
      additionalProperties: false
      description: Whole-number aspect ratings from 0 to 5.
    RatingMetric:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/RatingKey'
        label:
          type: string
        description:
          type: string
        weight:
          type: number
      required:
        - key
        - label
        - description
        - weight
    OverallRatingThreshold:
      type: object
      properties:
        minimumWeightedScore:
          type: number
        rating:
          type: integer
          minimum: 0
          maximum: 3
      required:
        - minimumWeightedScore
        - rating
    BarAttributeKey:
      enum:
        - quiz
        - liveMusic
        - boardGames
        - shuffleboard
        - darts
        - billiards
        - karaoke
        - sportsTv
      type: string
    BarAttribute:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/BarAttributeKey'
        label:
          type: string
          description: Swedish label.
      required:
        - key
        - label
    BarAttributes:
      type: array
      items:
        $ref: '#/components/schemas/BarAttributeKey'
      description: Bar features such as quiz or darts, in display order, without duplicates.
      uniqueItems: true
    ReviewMetadata:
      type: object
      properties:
        ratingMetrics:
          type: array
          items:
            $ref: '#/components/schemas/RatingMetric'
          description: Aspects in display order. The weights add up to 1.
        overallRating:
          type: object
          properties:
            minimum:
              type: integer
            maximum:
              type: integer
            thresholds:
              type: array
              items:
                $ref: '#/components/schemas/OverallRatingThreshold'
          required:
            - minimum
            - maximum
            - thresholds
          description: >
            The suggested overall rating is the highest `rating` whose

            `minimumWeightedScore` is at most the weighted sum of the aspect
            ratings, else 0.

            Reviewers may choose another value.
        beerBrands:
          type: array
          items:
            type: string
          description: Suggested brands. Any other brand name is also accepted.
        barAttributes:
          type: array
          items:
            $ref: '#/components/schemas/BarAttribute'
          description: Selectable bar attributes in display order.
        limits:
          type: object
          properties:
            titleMaxLength:
              type: integer
            descriptionMaxLength:
              type: integer
            locationMaxLength:
              type: integer
            slugMaxLength:
              type: integer
            beerBrandMaxLength:
              type: integer
            beerPriceMinKr:
              type: integer
            beerPriceMaxKr:
              type: integer
            beerVolumeMinCl:
              type: integer
            beerVolumeMaxCl:
              type: integer
            maxAuthors:
              type: integer
            imageMaxBytes:
              type: integer
              description: Maximum decoded image size.
            imageContentTypes:
              type: array
              items:
                $ref: '#/components/schemas/ImageContentType'
          required:
            - titleMaxLength
            - descriptionMaxLength
            - locationMaxLength
            - slugMaxLength
            - beerBrandMaxLength
            - beerPriceMinKr
            - beerPriceMaxKr
            - beerVolumeMinCl
            - beerVolumeMaxCl
            - maxAuthors
            - imageMaxBytes
            - imageContentTypes
      required:
        - ratingMetrics
        - overallRating
        - beerBrands
        - barAttributes
        - limits
    ReviewSort:
      enum:
        - latest
        - oldest
        - score
      type: string
      default: latest
    PublicationStatus:
      enum:
        - draft
        - published
      type: string
    ReviewImage:
      type: object
      properties:
        url:
          type: string
          description: Path relative to the server origin, for example
            `/api/v1/images/<file>`.
        focusX:
          type: number
          minimum: 0
          maximum: 100
          description: Horizontal focus point in percent for cropping.
        focusY:
          type: number
          minimum: 0
          maximum: 100
          description: Vertical focus point in percent for cropping.
      required:
        - url
        - focusX
        - focusY
    Beer:
      type: object
      properties:
        brand:
          type:
            - string
            - 'null'
          description: Null for older reviews without a brand.
        priceKr:
          type:
            - integer
            - 'null'
          description: Null for older reviews without a valid price.
        volumeCl:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 200
          description: Serving size in centilitres, or null when unknown.
        isHappyHourPrice:
          type: boolean
      required:
        - brand
        - priceKr
        - volumeCl
        - isHappyHourPrice
    Review:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        description:
          type: string
          description: Markdown.
        location:
          type: string
          description: Street address.
        ratings:
          $ref: '#/components/schemas/Ratings'
        overallRating:
          type: integer
          minimum: 0
          maximum: 3
        beer:
          $ref: '#/components/schemas/Beer'
        attributes:
          $ref: '#/components/schemas/BarAttributes'
        image:
          $ref: '#/components/schemas/ReviewImage'
        author:
          type: string
          description: Primary author.
        coAuthors:
          type: array
          items:
            type: string
        publicationStatus:
          $ref: '#/components/schemas/PublicationStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - slug
        - title
        - description
        - location
        - ratings
        - overallRating
        - beer
        - attributes
        - image
        - author
        - coAuthors
        - publicationStatus
        - createdAt
        - updatedAt
    ReviewList:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/Review'
      required:
        - reviews
    ImageContentType:
      enum:
        - image/jpeg
        - image/png
        - image/webp
      type: string
    ImageUpload:
      type: object
      properties:
        contentType:
          $ref: '#/components/schemas/ImageContentType'
        data:
          type: string
          contentEncoding: base64
          description: Standard base64 without a data-URL prefix. Convert HEIC to JPEG
            first.
      required:
        - contentType
        - data
      additionalProperties: false
    ImageFocus:
      type: object
      properties:
        x:
          type: number
          minimum: 0
          maximum: 100
        y:
          type: number
          minimum: 0
          maximum: 100
      required:
        - x
        - y
      additionalProperties: false
    BeerInput:
      type: object
      properties:
        brand:
          type: string
          minLength: 1
          description: A suggested brand from the metadata or another brand name.
        priceKr:
          type: integer
        volumeCl:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 200
          description: Optional serving size. Omission preserves an existing value on
            update; null clears it.
        isHappyHourPrice:
          type: boolean
      required:
        - brand
        - priceKr
        - isHappyHourPrice
      additionalProperties: false
    ReviewFields:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          description: Markdown.
        location:
          type: string
        slug:
          type: string
          description: Optional. The server derives a slug from the title when it is
            omitted.
        ratings:
          $ref: '#/components/schemas/RatingsInput'
        overallRating:
          type: integer
          minimum: 0
          maximum: 3
          description: Optional. The server uses the suggested overall rating when it is
            omitted.
        beer:
          $ref: '#/components/schemas/BeerInput'
        attributes:
          allOf:
            - $ref: '#/components/schemas/BarAttributes'
          description: >
            Optional. When omitted, a new review gets no attributes and an edit
            keeps the

            current attributes. Send an empty array to remove all attributes.
        authors:
          type: array
          minItems: 1
          items:
            type: string
          description: >
            Credited reviewers. The signed-in user becomes the primary author
            when selected;

            otherwise an existing primary author, then the first selection.
        imageFocus:
          $ref: '#/components/schemas/ImageFocus'
      required:
        - title
        - description
        - location
        - ratings
        - beer
        - authors
        - imageFocus
    ReviewCreateRequest:
      allOf:
        - $ref: '#/components/schemas/ReviewFields'
        - type: object
          properties:
            image:
              $ref: '#/components/schemas/ImageUpload'
          required:
            - image
      unevaluatedProperties: false
      x-max-body-bytes: 23068672
    ReviewUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ReviewFields'
        - type: object
          properties:
            image:
              $ref: '#/components/schemas/ImageUpload'
      unevaluatedProperties: false
      x-max-body-bytes: 23068672
    ReviewFieldChange:
      type: object
      properties:
        field:
          type: string
        label:
          type: string
          description: Swedish field label.
        before:
          type: string
        after:
          type: string
      required:
        - field
        - label
        - before
        - after
    ReviewHistoryEntry:
      type: object
      properties:
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ReviewFieldChange'
      required:
        - updatedAt
        - updatedBy
        - changes
    ReviewHistory:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ReviewHistoryEntry'
      required:
        - slug
        - title
        - entries
    MapMarker:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        overallRating:
          type: number
        location:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        beer:
          type:
            - object
            - 'null'
          properties:
            priceKr:
              type: integer
            isHappyHourPrice:
              type: boolean
          required:
            - priceKr
            - isHappyHourPrice
          description: Null when the review has no valid price.
        attributes:
          $ref: '#/components/schemas/BarAttributes'
      required:
        - slug
        - title
        - overallRating
        - location
        - latitude
        - longitude
        - beer
        - attributes
    ReviewMap:
      type: object
      properties:
        markers:
          type: array
          items:
            $ref: '#/components/schemas/MapMarker'
      required:
        - markers
    StatisticBar:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        beerPriceKr:
          type: integer
        isHappyHourPrice:
          type: boolean
      required:
        - slug
        - title
        - beerPriceKr
        - isHappyHourPrice
    NearbyReviews:
      type: object
      properties:
        addressKnown:
          type: boolean
          description: False when no review with this address has a saved position.
        radiiMetres:
          type: array
          items:
            type: integer
            minimum: 1
          description: The radii that `summary.counts` refers to, in order.
        summary:
          type:
            - object
            - 'null'
          properties:
            counts:
              type: array
              items:
                type: integer
                minimum: 0
              description: Cumulative number of other reviews within each radius, including
                drafts.
            nearest:
              type: array
              maxItems: 5
              items:
                $ref: '#/components/schemas/NearbyReview'
              description: Up to five reviews within the largest radius, nearest first.
            locatedCount:
              type: integer
              minimum: 0
              description: Other reviews with a known position.
            totalCount:
              type: integer
              minimum: 0
              description: All other active reviews, located or not.
          required:
            - counts
            - nearest
            - locatedCount
            - totalCount
          additionalProperties: false
          description: Null when the address is unknown or no other review has a known
            position.
      required:
        - addressKnown
        - radiiMetres
        - summary
      additionalProperties: false
    NearbyReview:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        distanceMetres:
          type: integer
          minimum: 0
      required:
        - slug
        - title
        - distanceMetres
      additionalProperties: false
    ReviewStatistics:
      type: object
      properties:
        totalReviews:
          type: integer
        gothenburgReviews:
          type: integer
        averageRating:
          type:
            - number
            - 'null'
        priceReviewCount:
          type: integer
          description: Number of valid regular-price entries, excluding happy hour.
        averageBeerPrice:
          type:
            - number
            - 'null'
        totalReviewerSpendKr:
          type: integer
          minimum: 0
          description: "Estimated spending in SEK: each public active review's valid
            whole-krona price (1–999), including happy hour, multiplied by its
            distinct credited reviewer count. Counts the primary author and
            co-authors, including legacy string co-authors and credits for
            deleted accounts. Blank or malformed credits and invalid prices
            contribute zero. Returns zero when no spending qualifies."
        happyHourReviewCount:
          type: integer
          description: Number of public active happy hour reviews with a valid price.
        happyHourPercentage:
          type:
            - number
            - 'null'
          description: Happy hour findings as a percentage of all valid price entries,
            including happy hour; null when none exist.
        cheapestBars:
          type: array
          items:
            $ref: '#/components/schemas/StatisticBar'
        mostExpensiveBars:
          type: array
          items:
            $ref: '#/components/schemas/StatisticBar'
        beerBrandPrices:
          type: array
          items:
            $ref: '#/components/schemas/BeerBrandPrice'
        valueReviewCount:
          type: integer
          minimum: 0
        averageClPerKr:
          type:
            - number
            - 'null'
          description: Arithmetic mean of each eligible regular-price review's volume
            divided by its price, excluding happy hour.
        bestValueBars:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ValueStatisticBar'
        worstValueBars:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ValueStatisticBar'
        beerBrandValues:
          type: array
          items:
            $ref: '#/components/schemas/BeerBrandValue'
      required:
        - totalReviews
        - gothenburgReviews
        - averageRating
        - priceReviewCount
        - averageBeerPrice
        - totalReviewerSpendKr
        - happyHourReviewCount
        - happyHourPercentage
        - cheapestBars
        - mostExpensiveBars
        - beerBrandPrices
        - valueReviewCount
        - averageClPerKr
        - bestValueBars
        - worstValueBars
        - beerBrandValues
      description: Statistics for public active reviews. Price and value averages,
        sample counts, rankings and brand aggregates exclude happy hour prices.
        Review counts and ratings include happy hour reviews; happy hour
        findings are counted separately. Estimated reviewer spending includes
        happy hour prices.
    ValueStatisticBar:
      allOf:
        - $ref: '#/components/schemas/StatisticBar'
        - type: object
          properties:
            beerVolumeCl:
              type: integer
              minimum: 1
              maximum: 200
            clPerKr:
              type: number
              exclusiveMinimum: 0
          required:
            - beerVolumeCl
            - clPerKr
    BeerBrandValue:
      type: object
      properties:
        brand:
          type: string
          minLength: 1
        averageClPerKr:
          type: number
          exclusiveMinimum: 0
        reviewCount:
          type: integer
          minimum: 1
        happyHourReviewCount:
          type: integer
          minimum: 0
      required:
        - brand
        - averageClPerKr
        - reviewCount
        - happyHourReviewCount
      additionalProperties: false
      description: Value statistics for regular prices only. The legacy
        happyHourReviewCount field is always zero.
    BeerBrandPrice:
      type: object
      properties:
        brand:
          type: string
          minLength: 1
        averagePriceKr:
          type: number
          minimum: 1
          maximum: 999
        reviewCount:
          type: integer
          minimum: 1
        happyHourReviewCount:
          type: integer
          minimum: 0
      required:
        - brand
        - averagePriceKr
        - reviewCount
        - happyHourReviewCount
      additionalProperties: false
      description: Price statistics for regular prices only. The legacy
        happyHourReviewCount field is always zero.
    ReviewRequestCreateRequest:
      type: object
      properties:
        barName:
          type: string
        location:
          type: string
        motivation:
          type: string
      required:
        - barName
        - location
      additionalProperties: false
      x-max-body-bytes: 16384
    ReviewRequestAccepted:
      type: object
      properties:
        message:
          type: string
          description: Swedish confirmation for the user.
      required:
        - message
