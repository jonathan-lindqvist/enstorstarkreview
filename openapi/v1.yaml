    ReviewStatistics:
      type: object
      properties:
        totalReviews:
          type: integer
        gothenburgReviews:
          type: integer
        averageRating:
          type:
            - number
            - "null"
        priceReviewCount:
          type: integer
          description: Number of valid regular-price entries, excluding happy hour.
        averageBeerPrice:
          type:
            - number
            - "null"
        totalReviewerSpendKr:
          type: integer
          minimum: 0
          description: "Estimated spending in SEK: each public active review's valid whole-krona price (1–999), including happy hour, multiplied by its distinct credited reviewer count. Counts the primary author and co-authors, including legacy string co-authors and credits for deleted accounts. Blank or malformed credits and invalid prices contribute zero. Returns zero when no spending qualifies."
        happyHourReviewCount:
          type: integer
          description: Number of public active happy hour reviews with a valid price.
        happyHourPercentage:
          type:
            - number
            - "null"
          description: Happy hour findings as a percentage of all valid price entries, including happy hour; null when none exist.
        cheapestBars:
          type: array
          items:
            $ref: "#/components/schemas/StatisticBar"
        mostExpensiveBars:
          type: array
          items:
            $ref: "#/components/schemas/StatisticBar"
        beerBrandPrices:
          type: array
          items:
            $ref: "#/components/schemas/BeerBrandPrice"
        valueReviewCount:
          type: integer
          minimum: 0
        averageClPerKr:
          type:
            - number
            - "null"
          description: Arithmetic mean of each eligible regular-price review's volume divided by its price, excluding happy hour.
        bestValueBars:
          type: array
          items:
            $ref: "#/components/schemas/ValueStatisticBar"
          maxItems: 5
        worstValueBars:
          type: array
          items:
            $ref: "#/components/schemas/ValueStatisticBar"
          maxItems: 5
        beerBrandValues:
          type: array
          items:
            $ref: "#/components/schemas/BeerBrandValue"
      required:
        - totalReviews
        - gothenburgReviews
        - averageRating
        - priceReviewCount
        - averageBeerPrice
        - totalReviewerSpendKr
        - happyHourReviewCount
        - happyHourPercentage
        - cheapestBars
        - mostExpensiveBars
        - beerBrandPrices
        - valueReviewCount
        - averageClPerKr
        - bestValueBars
        - worstValueBars
        - beerBrandValues
      additionalProperties: false
      description: Statistics for public active reviews. Price and value averages, sample counts, rankings and brand aggregates exclude happy hour prices. Review counts and ratings include happy hour reviews; happy hour findings are counted separately. Estimated reviewer spending includes happy hour prices.
