services:
  app:
    container_name: enstorstarkreview-app
    build:
      context: .
      args:
        MONGO_URI: mongodb://localhost:27017/enstorstark
    environment:
      HOST: 0.0.0.0
      MONGO_URI: ${APP_MONGO_URI:?APP_MONGO_URI is required}
      NODE_ENV: production
      PORT: 3000
      REVIEW_REQUEST_DISCORD_WEBHOOK_URL: ${REVIEW_REQUEST_DISCORD_WEBHOOK_URL:?REVIEW_REQUEST_DISCORD_WEBHOOK_URL is required}
      TRUST_PROXY: 'true'
      # Consumed by SvelteKit adapter-node; keep above the 25 MB image limit plus multipart overhead.
      BODY_SIZE_LIMIT: 30M
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - '3000'
    volumes:
      - app-images:/app/uploads/images
    networks:
      - default
      - caddy_net

  mongo:
    container_name: enstorstarkreview-mongo
    build:
      context: ./db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: enstorstark
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok"'
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-images:
  mongo-data:

networks:
  caddy_net:
    external: true
