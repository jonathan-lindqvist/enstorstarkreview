name: CI

# Every job runs `make ci` for one stage, so GitHub and local runs use the same Docker image,
# database, and scripts/ci/run-all.sh. Add checks there; keep this file to checkout, the
# baseline, artifacts, and the Docker backup rehearsal (which needs the runner's daemon).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make ci STAGES=quality

  coverage:
    name: Unit tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `make ci` archives the baseline from history.
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact baseline
        id: baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] || exit 1
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Reject any coverage decrease from the exact baseline
        env:
          CI_BASE: ${{ steps.baseline.outputs.sha }}
        run: make ci STAGES=coverage CI_BASE="$CI_BASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          retention-days: 30
          if-no-files-found: error

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test backups and restoration using disposable volumes
        run: npm run test:deploy:restore
      - run: make ci STAGES=integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  required:
    name: CI passed
    if: always()
    needs: [quality, coverage, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          COVERAGE: ${{ needs.coverage.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          test "$QUALITY" = success
          test "$COVERAGE" = success
          test "$INTEGRATION" = success
