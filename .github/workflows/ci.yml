name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (${{ matrix.checks }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The check groups of `make ci`, each on its own runner; a local `make ci FULL=1` runs them all.
        checks: [integration-1, integration-2, integration-3, rehearsal, checks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches the CI image's layers in the Actions cache (docker-compose.ci.github.yml), so a run
      # rebuilds it only when its inputs change. The cache needs a buildx builder and the job's
      # runtime token, which only actions can read; it is scoped to this run's cache.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # Buildx picks the cache service from these, including ACTIONS_CACHE_SERVICE_V2.
          script: |
            for (const [name, value] of Object.entries(process.env)) {
              if (name.startsWith('ACTIONS_')) core.exportVariable(name, value);
            }
      # The same entry point as a local run; see README.md#run-the-ci-checks.
      - run: make ci CHECKS="$CHECKS"
        env:
          CHECKS: ${{ matrix.checks }}
      - name: Publish the check summary
        if: always()
        run: test ! -f ci-output/summary.md || cat ci-output/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.checks == 'checks'
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-output/coverage/
          retention-days: 30
          # A run that fails before the unit tests has no report; the failed check already says why.
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && startsWith(matrix.checks, 'integration-')
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.checks }}
          path: ci-output/test-results/
          retention-days: 14

  passed:
    # Branch protection requires this check name; it passes only when every check group passed.
    name: CI passed
    needs: ci
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-24.04
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.ci.result }}
