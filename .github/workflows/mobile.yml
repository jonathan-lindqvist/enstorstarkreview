name: Mobile

# The native apps' own checks, for app and API contract changes. Best effort like the apps
# themselves: not a required check. Release workflows come separately; this one reads no secret.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths: ['mobile/**', 'openapi/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['mobile/**', 'openapi/**', '.github/workflows/mobile.yml']

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Java and Gradle from mobile/android/mise.toml; the runner's ANDROID_HOME is kept.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          working_directory: mobile/android
      # Caches Gradle's dependencies and build cache; Gradle itself comes from mise.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: gradle :app:testDebugUnitTest :app:verifyRoborazziDebug :app:lintDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-reports-${{ github.run_id }}-${{ github.run_attempt }}
          # Test and lint reports, and the screenshot comparisons.
          path: |
            mobile/android/app/build/reports/
            mobile/android/app/build/outputs/roborazzi/
          retention-days: 14
          if-no-files-found: ignore

  ios:
    name: iOS
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Standard GitHub-hosted runners are free for public repositories, macOS included.
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the newest released Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mobile/ios/.build/xcode/SourcePackages
          key: ios-packages-${{ hashFiles('mobile/ios/Package.resolved') }}
      # Any available iPhone simulator of the newest runtime; the project simulator is local only.
      - name: Model tests
        run: |
          simulator=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
              | select(.name | startswith("iPhone"))] | last | .udid')
          xcodebuild test -quiet -workspace Project.xcworkspace -scheme EnStorStarkModelTests \
            -destination "id=$simulator" -derivedDataPath .build/xcode -skipPackagePluginValidation
