name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.repository == 'jonathan-lindqvist/enstorstarkreview'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: https://enstorstarkreview.se
    steps:
      - name: Deploy the tested revision through the restricted SSH command
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[a-f0-9]{40}$ && "$TESTED_SHA" != 0000000000000000000000000000000000000000 ]] || exit 1
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo 'Configure production DEPLOY_HOST'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Configure production DEPLOY_USER'; exit 1; }
          if ! [[ "$DEPLOY_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( DEPLOY_PORT > 65535 )); then
            echo 'Configure a valid production DEPLOY_PORT'; exit 1
          fi
          if [[ -z "$DEPLOY_SSH_KEY" || -z "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo 'Configure the production SSH secrets'; exit 1
          fi
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/deploy-ssh.XXXXXX")
          cleanup() { rm -rf -- "$ssh_dir"; }
          trap cleanup EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          ssh -T -i "$ssh_dir/key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $TESTED_SHA"
          printf 'Deployment requested tested commit %s. The server skips superseded commits.\n' "$TESTED_SHA" >> "$GITHUB_STEP_SUMMARY"
